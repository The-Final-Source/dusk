apiVersion: v1
kind: PersistentVolume
metadata:
  name: dusk-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: /srv/k8s-data/dusk/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dusk-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: hostpath
  volumeName: dusk-postgres-pv
---
apiVersion: v1
kind: Service
metadata:
  name: dusk-postgres-service
spec:
  type: ClusterIP
  selector:
    app: dusk-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dusk-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dusk-postgres
  template:
    metadata:
      labels:
        app: dusk-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: dusk-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: dusk-postgres-pvc
