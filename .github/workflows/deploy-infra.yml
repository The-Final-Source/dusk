name: Deploy Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".k8s/**"

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          echo "REPO_NAME=$(basename $GITHUB_REPOSITORY)" >> $GITHUB_ENV

      - name: Generate Postgres secrets
        run: |
          ENV_FILE="$HOME/envs/${{ env.REPO_NAME }}-postgres.env"
          if [ ! -f "$ENV_FILE" ]; then
            echo "ERROR: $ENV_FILE not found. Run init.sh first."
            exit 1
          fi
          kubectl delete secret ${{ env.REPO_NAME }}-postgres-secret --ignore-not-found
          kubectl create secret generic ${{ env.REPO_NAME }}-postgres-secret \
            --from-env-file="$ENV_FILE"

      - name: Generate MinIO secrets
        run: |
          ENV_FILE="$HOME/envs/${{ env.REPO_NAME }}-minio.env"
          if [ -f "$ENV_FILE" ]; then
            kubectl delete secret ${{ env.REPO_NAME }}-minio-secret --ignore-not-found
            kubectl create secret generic ${{ env.REPO_NAME }}-minio-secret \
              --from-env-file="$ENV_FILE"
          fi

      - name: Deploy PostgreSQL
        run: |
          sed "s|dusk|${{ env.REPO_NAME }}|g" \
            .k8s/postgres-deployment.yml | kubectl apply -f -
          kubectl rollout status deployment/${{ env.REPO_NAME }}-postgres --timeout=120s

      - name: Apply shared ingress
        run: |
          INGRESS_DIR="$HOME/Documents/local-applications/k8s-ingress"
          if [ -d "$INGRESS_DIR" ]; then
            cd "$INGRESS_DIR"
            git pull origin main || true
            kubectl apply -f ingress.yaml
          fi
