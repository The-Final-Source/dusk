# OpenSpec project configuration for Dusk.
# `context` + `rules` are injected into every artifact via `openspec instructions`.
# This config describes Dusk's current and intended desired state — keep it evergreen.
# Design source of truth: docs/rfcs/001-mvp-rfc/ (architecture proposal, build roadmap, implementation plan).
schema: spec-driven

context: |
  # Dusk — Intent Architecture

  ## Vision
  Dusk is a constraint-satisfaction system for spec-driven AI development. The endgame is a
  singularity where humans no longer read nor write code: they work from INTENTS via agent
  dialog, and an exhaustive data/context harness + orchestration flow turns those intents into
  perfectly implemented, adherent software. Many age-old practices that exist to make code
  human-readable/writable do NOT apply here — code is authored for AI consumption. Build for
  RIGHT, assume infinite resources/runway/scope, land the plane.

  ## The three layers
  1. **Constraint language** — Intents (atomic, hierarchical via slash-path) + total code
     Decoration express architectural intent as structured, composable, machine-verifiable
     constraints. The intent IS the assertion; there is no separate "constraint" or "block" layer.
  2. **Solver** — nine bounded sub-agent roles drive a 9-step request→commit pipeline under
     Dusk's own orchestration; agents receive constraints and produce conforming, decorated code.
  3. **Verifier** — multi-agent evaluation checks implementations against the full constraint set,
     per-aspect, with scoped evidence.

  ## Source-of-truth documents (docs/rfcs/001-mvp-rfc/)
  - `intent-architecture-proposal.md` — the architecture spec (THE spec; cite § numbers).
  - `intent-architecture-roadmap.md` — the phased build roadmap + the locked architectural-commitments table.
  - the implementation plan (same directory) — THE CONTRACT: the phase-focused plan; each phase carries
    integrated Khorikov behavioral tests (Pn-Tn) and cohesive-landing gates. Every OpenSpec change maps to one phase.
  Always ground a change in these. Cite the architecture spec's § and the plan's phase + test slugs.

  ## Delivery model — one OpenSpec change per phase (NON-NEGOTIABLE)
  Each plan phase is delivered as ITS OWN OpenSpec change:
    - The change's scope = exactly that phase's Scope (no later-phase scope leaks in).
    - A phase ships WHOLE or not at all (cohesive landing — no "we'll wire it up next phase").
    - The phase's behavioral tests + phase-landing smoke test ARE the acceptance criteria.
    - The phase's Cohesive landing criteria ARE the archival gate.
    - The plan's commitment→phase coverage matrix is the cross-change ledger (every commitment
      delivered exactly once across the changes; nothing silently dropped).
  Phase order: 1 Substrate → 2 Runtime+Read-Path Verification → 3 Implementation Pipeline →
  4 Intent Authoring → 5 Validation/Benchmark/Dogfood. (Phase 2's two halves, and Phase 4 alongside
  the back half of Phase 3, may be authored in parallel per the plan's sequencing note.)
  Post-v1 (v1.x): 6 Greenfield POC — scaffolded ONLY after Phase 5 archives and v1 is landed; it
  CONSUMES the finished v1 runtime (reshapes nothing) and adds no rows to the commitment→phase
  coverage matrix.

  ## Tech stack
  - Language: TypeScript (strict, ES2022, ESM throughout). Package namespace: @dusk/*.
  - Monorepo: pnpm workspaces + Turborepo (NOT NX — some older design text mentions NX; the repo uses Turbo).
  - Validation/types: Zod is THE source of truth; derive TS via z.infer; never duplicate a shape.
  - Testing: Vitest, colocated *.test.ts, mock-first / London-school for new code.
  - Persistence: PostgreSQL 16 via Drizzle ORM (real Postgres in integration tests).
  - Integration surface: Dusk runs as an MCP server; sub-agents spawn via Claude Code's Task tool
    (`subagent_type: dusk-<role>`); the only hook surface is a PreToolUse gate.
  - Git: git worktrees per parallel bead (`dusk/<bead-id>`), topological rebase merge.
  - Existing app packages (production-ready, untouched until the dogfooding phase): api (Express + tRPC
    + Drizzle + pg-boss + PgPubSub), web (React + Vite + Tailwind), shared (Zod schemas, pure leaf),
    hooks (tRPC React Query), mobile (Expo).

  ## Model & determinism posture (NOT built to scale yet)
  - Single FRONTIER-tier model across all roles for determinism + judgment quality; per-role override
    via dusk.config.yml. Tier-down/cost optimization is an efficacy-benchmark decision, NOT a default.
  - Verifier/Test-Runner verdict calls run at `temperature: 0`.
  - Tests split into two categories: CONTROL-FLOW/orchestration tests (budgets, stuckness, confirmation
    pass, livelock, recovery ladder, cancel) run against a SCRIPTED-VERDICT VERIFIER DOUBLE (zero model
    calls, deterministic); VERDICT-CORRECTNESS tests run against the real frontier model on curated
    unambiguous fixtures, asserting only structural outcomes. Variance-dependent features (the
    fresh-Verifier audit, the confirmation pass) use explicit-N statistical thresholds (pre-registered).
  - Shared test infra: temp-repo factory, real-hook invoker, scripted-verdict Verifier double, injectable
    clock (Phase 1); test-mode `raw_prompt` capture on the spawn pipeline (Phase 2). CI is pragmatic,
    not scale-ready — we optimize the substrate when efficacy testing begins.

  ## Constraint-language model (use this vocabulary precisely)
  - Intent: { id (= slash-path), description, obligation (must|should|may), compose (all|any|none|implies),
    triples | (antecedent + consequent), relates_to[] }. Intent files carry a `schema_version` (migrated
    forward automatically by the loader).
  - Triple: { id, subject, predicate, object, polarity?, quantifier?, scope? }. Slots are ALWAYS affirmative
    English. Negation is the structural `polarity: positive|negative` field — the runtime inverts the
    affirmative LLM verdict post-call; THE LLM NEVER SEES NEGATION. Parser rejects matrix-predicate negation
    in the predicate slot (matrix/constituent rule); constituent negation inside noun phrases is legal.
  - Quantifier: at-least-one|each|exactly-one|at-most-one|none|at-least-N|at-most-N + optional `scope`.
  - compose: implies — antecedent group uses a CLOSED predicate vocabulary ("is decorated with",
    "claims any aspect of", "is enclosed by a decoration of") evaluated by DETERMINISTIC INDEX LOOKUP,
    never LLM-judged; consequents are LLM-evaluated only if the antecedent holds.
  - Typed relates_to (5 kinds): parent | implies | conflicts | supersedes | sibling.
  - Decoration is TOTAL: every statement carries @intent (focal) / @intent-support (supporting, with inline
    NL triple) / @intent-test / @intent-test-file / @intent-file / @intent-ignore. Focal vs support scopes
    Verifier reading per-aspect. Derived index (forward/reverse/focal+support/aspect-rollup/test-discovery)
    is in-memory, rebuilt at session start; session-snapshot + per-bead delta under parallel worktrees.
  - Test pyramid via reserved child-intent suffixes (/unit-tests, /integration-tests, /e2e-tests; configurable).
    Two-stage satisfaction: Verifier confirms the test body verifies the claim AND the Test Runner executes it.
  - Verdict split: per-triple focal_verdict (drives re-draft) + support_quality (advisory) + per-claim
    triple_verdict (matches|mismatch|vague). DuskError envelope on every MCP tool.

  ## The 9-step pipeline & 9 roles
  Pipeline: 1 request decomposition → 2 bead DAG + sequencing (file-overlap + cross-bead focal/support
  overlap) → 3 worktrees → 4 short cycle (Engineer+Verifier pair; stuckness detector; iter-5 fallback;
  iter-15 escalation; 40-iter lifetime budget; 4-level recovery ladder) → 5 long cycle (N=10 shuffle +
  N=2 confirmation pass) → 6 test execution (Test Runner; two-stage; livelock detection) → 7 atomic commit
  (Conventional Commits + structured trailers) → 8 worktree merge (Conflict Resolver) → 9 return summary.
  Roles (memory scope in frontmatter): Root Orchestrator (session), Bead Orchestrator (bead), Decomposer
  (none), Scout (none), Engineer (bead), Verifier (none, fresh-per-call), Test Runner (bead), Author (dialog),
  Conflict Resolver (none). Engineer ⊥ Verifier asymmetry: diagnosis routes to the Bead Orchestrator ONLY,
  never into the Verifier's spawn payload (structural no-leak, verified against raw_prompt + the freshness audit).

  ## Package layout to BUILD (new packages)
  - packages/core/{schema, parser (incl. negation-detector), graph, decoration, index}
  - packages/delivery/{pre-tool-use (10-check gate → 12 rejection kinds), mcp-server}
  - packages/runtime/{orchestrator (+spawn), memory, skills, tool-scope, decomposer, worktree, engineer,
    verifier, short-cycle, long-cycle, test-runner, livelock-detection, recovery-ladder, implement-checkpoint,
    commit, merge, conflict-resolver, author, cancel, observability, benchmark}
  - packages/intents/canonical (documentation examples — NOT runtime-fetched)
  - packages/fixtures/{seeded-violations (~60, with ground_truth_defect_loc), worked-example}
  - packages/cli — the `dusk` CLI (init, validate, inspect, verify, doctor, test, implement, benchmark, roles, skills)
  - .claude/agents/dusk-*.md (9 role files), .claude/skills/dusk/<role>/* (role-bound skills)
  - .ia/ contract: intents/ (checked in), runtime/ (gitignored: beads, dialogs, session, implement), observability/

  ## Explicitly NOT part of Dusk (do NOT introduce)
  No Blocks / .block.yaml; no composition engine / manifest / facets / token budgets; no source-map
  pipeline / source-map.json / audit.json / PostToolUse maintainer; no embeddings / vector / RAG layer
  (Author discovery is agent-driven grep); no triage pass; no adherence SQLite DB (satisfaction is computed
  on-demand from the in-memory index). The CLI prefix is `dusk`. "Constraint" as a separate inner layer does
  not exist (the Intent is the assertion). Platform features (registry/authoring/dashboard) live in the
  EXISTING api (routers/services) + web (views) packages, not a new platform/ package.

  ## Coding standards (.praxis — FOLLOW EXACTLY)
  Functional-first (functions > classes; classes only for long-lived mutable state with lifecycle).
  Zod schema = source of truth; z.infer for types. Named exports only (no default exports, except Expo
  Router route files). `type` over `interface`. Result objects internally ({ success, error }); TRPCError
  only at procedure boundaries. Factory functions (closures) over classes for config-holding objects. Config
  via injection — only env.ts reads process.env. One concept per file; files < 500 lines; extract at 3+
  repetitions. Colocated tests. Import order: node builtins → external → internal packages → relative.
  camelCase files (PascalCase React components), UPPER_SNAKE_CASE constants, is/has/can booleans. Package
  conventions: type:module, private:true, workspace:* internal deps, exports field, composite:true for libs,
  barrel src/index.ts (consumers import from package name, never internal paths). NEVER save files to repo root.

  ## Engineering philosophy
  Simple over complex (Fowler + Hickey). Build for RIGHT (not convenience/cost/resource constraints).
  Spec-driven ALWAYS (every feature starts from an OpenSpec change). Test-driven where possible. Honest over
  flattering — NEVER blend mechanical and semantic adherence; no silent overrides; no vanity numbers. No
  silent behavior — surface conflicts, truncations, staleness explicitly (DuskError / structured rejections).

rules:
  proposal:
    - Ground the proposal in the design docs (docs/rfcs/001-mvp-rfc/) — cite the architecture spec's §
      numbers and the implementation plan's phase + behavioral-test slugs (e.g. P2-T6).
    - State which ONE plan phase this change delivers. A change delivers exactly one phase's Scope — never
      a slice of one phase nor pieces of two.
    - Include a "Non-goals" section (be explicit about deferred/out-of-scope, including anything the roadmap
      explicitly defers).
    - Include a "Verifiability / acceptance" section that ties success to the phase's behavioral tests and
      its phase-landing smoke test (the contract). Name the cohesive-landing criteria as the archival gate.
    - Reference architecture entities by name (Intent, Triple, polarity, quantifier, the implies operator, typed
      relates_to, the 6 decoration markers, the 9 roles, the 9-step pipeline). Do NOT use removed vocabulary
      (Blocks, manifest/facets, source-map, triage, adherence DB).
    - Honor the determinism posture — frontier model + temperature 0; control-flow tested via the
      scripted-verdict Verifier double; not built to scale.
    - Keep proposals tight (~under 800 words). Call out and justify any deviation from the spec/plan.
  tasks:
    - Each task is completable in one focused session (≤ ~4h) and ordered by dependency (no forward references).
    - Every task has acceptance criteria referencing a specific behavioral test (Pn-Tn) or spec scenario,
      plus a "Test plan" naming the Vitest tests/fixtures that prove it.
    - Control-flow/orchestration tasks must specify the scripted-verdict Verifier double + injectable clock;
      verdict-correctness tasks must specify the real frontier model at temperature 0 with curated fixtures.
    - Tasks that add a package follow .praxis/features/adding-packages.md exactly and name the package path
      (packages/core|delivery|runtime|intents|fixtures|cli/...). Specify cross-package deps (workspace:*,
      tsconfig references) explicitly.
    - Public-API tasks include typed Zod interfaces (source of truth). Follow functional-first, named exports,
      Result objects, one concept per file (<500 lines).
    - Do NOT defer anything the phase owns to "next phase" — the phase lands cohesively.
  design:
    - Capture the HOW for non-obvious decisions only; small changes get a brief design. Record tradeoffs.
    - Note seams that are cross-change interfaces (e.g. the implement-checkpoint JSON shape the Author phase
      consumes, the SubAgentTrace fields, the Verifier-double test seam) and pin their shape here.
    - State which determinism mechanism each behavior is tested through (real model vs Verifier double).
  specs:
    - Delta specs ("## ADDED/MODIFIED Requirements") reference the specific architecture-spec §(s) and plan
      phase they implement, and use WHEN/THEN/AND scenarios that map 1:1 onto the phase's behavioral tests.
    - Ground every requirement in the constraint-satisfaction model (Intents + total decoration + the
      9-step pipeline + the 9 roles). Use the architecture vocabulary consistently.
    - Include Zod schema definitions for any new data structure; specify file-path conventions (the monorepo
      layout) and which layer is affected (core / delivery / runtime / cli, or existing api/web/shared).
    - For verification/decoration behavior, specify polarity inversion (LLM never sees negation), deterministic
      antecedent lookup (no LLM call), the focal/support verdict split, and the mechanical-vs-semantic
      verifiability distinction (NEVER blended).
    - Specify error cases and what "honest reporting" looks like — the DuskError envelope and structured
      PreToolUse rejections, not silent failure. Reference the phase's cohesive-landing criteria.
