schema_version: 2
id: api/metrics/dogfood-report
description: The dogfood-report query procedure reads the dogfood go/no-go
  artifact through the artifact resolver, validates the payload against the
  @dusk/core-schema dogfood Zod schema, and returns a presence envelope. Schema
  validation failures return an error envelope rather than throwing.
obligation: must
compose: all
triples:
  - id: no-throw-on-failure
    subject: the dogfood report procedure
    predicate: throw
    object: a TRPCError or any uncaught error on schema validation failure
    polarity: negative
  - id: read-via-resolver
    subject: the dogfood report procedure
    predicate: read
    object: the dogfood artifact through the artifact resolver
  - id: validate-schema
    subject: the dogfood report procedure
    predicate: validate
    object: the raw payload against the @dusk/core-schema dogfood Zod schema before
      returning it
relates_to:
  - kind: sibling
    target: api/metrics/static-analysis-report
  - kind: implies
    target: api/metrics/artifact-resolution
