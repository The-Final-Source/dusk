id: logic-domain-rules
version: "1.0.0"
layer: logic
summary: Domain logic isolation with pure functions and explicit error handling
constraints:
  - id: pure-domain-functions
    text: Domain logic functions must be pure with no side effects
    obligation: must
    verifiability: semantic
  - id: result-objects
    text: Fallible domain operations must return result objects instead of throwing
    obligation: must
    verifiability: mechanical
  - id: no-framework-imports
    text: Domain logic should not import from framework or infrastructure packages
    obligation: should
    verifiability: mechanical
  - id: domain-testing
    text: Domain functions should have unit tests with >80% branch coverage
    obligation: should
    verifiability: semantic
relates_to:
  - target: api-rest-conventions
    relationship: constrains
    rationale: Domain rules constrain how API layer handles business operations
  - target: data-persistence
    relationship: tension-with
    rationale: Pure domain functions are in tension with ORM entity patterns
    decision_required: true
    decision_prompt: How should domain logic interact with persisted entities?
    constraint_pairs:
      - source: pure-domain-functions
        target: typed-queries
        failure: Domain functions coupled to ORM reduce testability
decision_points: []
