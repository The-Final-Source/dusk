id: data-persistence
version: "1.0.0"
layer: data
summary: Relational data persistence with migrations and type-safe queries
constraints:
  - id: migration-required
    text: All schema changes must go through versioned migrations
    obligation: must
    verifiability: mechanical
  - id: typed-queries
    text: Database queries must use a type-safe query builder or ORM
    obligation: must
    verifiability: mechanical
  - id: no-raw-sql
    text: Raw SQL should be avoided except for complex analytical queries
    obligation: should
    verifiability: semantic
  - id: seed-idempotent
    text: Seed scripts must be idempotent and safe to re-run
    obligation: must
    verifiability: mechanical
relates_to:
  - target: api-rest-conventions
    relationship: complements
    rationale: API layer consumes data layer through service functions
decision_points:
  - id: orm-choice
    description: Which ORM or query builder to use
    options: ["drizzle", "prisma", "kysely"]
    default: drizzle
