id: todo-fullstack
scope: packages/todo-app
adopts:
  - api-rest-conventions
  - data-persistence
  - logic-domain-rules
decisions:
  - point: api-framework
    choice: express+trpc
  - point: orm-choice
    choice: drizzle
  - point: domain-data-interaction
    choice: repository-pattern
    rationale: Use repository pattern to decouple domain logic from ORM
relates_to: []
constraints:
  - id: todo-max-length
    text: Todo items must not exceed 500 characters
    obligation: must
    verifiability: mechanical
  - id: todo-soft-delete
    text: Todos should use soft deletion to allow recovery
    obligation: should
    verifiability: mechanical
