schema_version: 2
id: shared/schemas/notification-title-field
description: The notification title field schema enforces a maximum length of
  255 Unicode code points at the system boundary.
obligation: must
compose: all
triples:
  - id: reject-title-exceeding-max-length
    subject: the notification title field schema
    predicate: accept
    object: a value whose length exceeds 255 Unicode code points
    polarity: negative
relates_to:
  - kind: sibling
    target: shared/schemas/email-field
  - kind: sibling
    target: shared/schemas/name-field
  - kind: sibling
    target: shared/schemas/notification-body-field
