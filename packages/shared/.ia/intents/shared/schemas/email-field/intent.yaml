schema_version: 2
id: shared/schemas/email-field
description: The email field schema validates that input conforms to RFC 5322
  structural email format at the system boundary, before any business logic
  runs. Deliverability, MX lookup, and domain-existence checks are out of scope.
obligation: must
compose: all
triples:
  - id: reject-invalid-email-format
    subject: the email field schema
    predicate: reject
    object: input that does not conform to RFC 5322 structural email format
relates_to:
  - kind: sibling
    target: shared/schemas/name-field
  - kind: sibling
    target: shared/schemas/notification-title-field
  - kind: sibling
    target: shared/schemas/notification-body-field
